<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Expense Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Navbar Minimal -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="brand">💰 Expense Tracker</a>
      <a href="/" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.4rem 0.85rem;">← Kembali ke Beranda</a>
    </div>
  </nav>

  <!-- Login Card -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Selamat Datang Kembali</h1>
        <p>Masuk ke akun Anda untuk mengelola keuangan pribadi.</p>
      </div>

      <!-- Pesan Notifikasi / Error -->
      <div id="loginAlert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="identifier" class="form-label">Email atau Username</label>
          <input 
            type="text" 
            id="identifier" 
            class="form-control" 
            placeholder="contoh: budi atau budi@example.com" 
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Masukkan kata sandi Anda" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
          Masuk
        </button>
      </form>

      <div class="auth-footer">
        Belum memiliki akun? <a href="/register">Daftar sekarang</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Expense Tracker.</p>
    </div>
  </footer>

  <script src="/static/js/auth.js"></script>
  <script>
    // Jika sudah login, redirect langsung ke /dashboard
    checkAuth({ redirectIfLoggedIn: true });
    initLoginForm();
  </script>
</body>
</html>
