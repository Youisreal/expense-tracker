<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru - Expense Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Navbar Minimal -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="brand">💰 Expense Tracker</a>
      <a href="/" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.4rem 0.85rem;">← Kembali ke Beranda</a>
    </div>
  </nav>

  <!-- Register Card -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Buat Akun Baru</h1>
        <p>Mulai catat dan kelola arus kas Anda secara teratur hari ini.</p>
      </div>

      <!-- Pesan Notifikasi / Error -->
      <div id="registerAlert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input 
            type="text" 
            id="username" 
            class="form-control" 
            placeholder="Minimal 3 karakter (contoh: budi_santoso)" 
            required 
            minlength="3"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Alamat Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="nama@email.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Minimal 6 karakter" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control" 
            placeholder="Ulangi kata sandi Anda" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
          Daftar Sekarang
        </button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="/login">Masuk ke sini</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Expense Tracker.</p>
    </div>
  </footer>

  <script src="/static/js/auth.js"></script>
  <script>
    // Jika sudah login, redirect langsung ke /dashboard
    checkAuth({ redirectIfLoggedIn: true });
    initRegisterForm();
  </script>
</body>
</html>
